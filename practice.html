</style></head><body><main><div class="top"><a href="./index.html">← 科目トップへ戻る</a><span class="pill">オリジナル問題</span></div><h1>高校数学 演習ラボ</h1><p class="muted">知識の確認から資料・文章を読み取る問題まで。解答後に採点し、解説と復習問題を確認できます。</p><section class="panel" id="setup"><h2>選択内容</h2><p id="chosenSubjects" class="muted"></p><p id="chosenUnits" class="muted"></p><fieldset id="unitChoices" style="border:0;padding:0;margin:12px 0"><legend>学習する単元（複数選択可）</legend><label><input type="checkbox" name="mathUnit" value="数と式・二次方程式"> 数と式・二次方程式</label><br><label><input type="checkbox" name="mathUnit" value="二次関数・グラフ"> 二次関数・グラフ</label><br><label><input type="checkbox" name="mathUnit" value="図形・三平方の定理"> 図形・三平方の定理</label><br><label><input type="checkbox" name="mathUnit" value="確率・場合の数"> 確率・場合の数</label><br><label><input type="checkbox" name="mathUnit" value="データ分析"> データ分析</label><br><label><input type="checkbox" name="mathUnit" value="数列・ベクトル"> 数列・ベクトル</label></fieldset><p id="unitInfo" class="muted">選んだ単元から出題します。</p><label for="mode">学習方法</label><select id="mode"><option value="formula">1. 公式・覚え方を見る</option><option value="shortcut">A. 裏技公式・使い分けを見る</option><option value="basic">2. 基本問題</option><option value="truefalse">B. 公式の正誤問題</option><option value="geometry">3. 応用・図形問題</option><option value="common">C. 共通テスト型演習</option><option value="proof">証明問題</option><option value="mock">模擬テスト・弱点分析</option></select><p id="modeInfo" class="muted"></p><button id="start">選んだ内容で始める</button></section><section class="panel hidden" id="quiz" aria-live="polite"><div class="top"><span id="counter" class="pill"></span><span id="scoreLive" class="muted"></span></div><div class="progress"><span id="bar"></span></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="explain hidden"></div><div class="row" style="margin-top:18px"><button id="check">解答する</button><button id="next" disabled>次の問題 →</button></div></section><section class="panel hidden" id="result"><h2>結果・弱点分析</h2><p id="summary"></p><p id="analysis" class="muted"></p><h3>間違えた問題</h3><div id="missed"></div><div class="row"><button id="review">間違えた問題を復習</button><button id="again">もう一度挑戦</button></div></section><p class="muted">※本番問題の転載ではなく、学習用に作成したオリジナル問題です。出題範囲は今後拡充します。</p></main><script>
const BANK=[["二次方程式 x²−5x+6=0 の解は？",["x=1,6","x=−2,−3","x=2,3","x=−1,−6"],2,"(x−2)(x−3)=0 より x=2,3。"],["関数 y=2x+1 の傾きは？",["1","2","−2","−1"],1,"y=ax+b の傾きは x の係数 a。"],["a²−b² を因数分解すると？",["(a−b)²","(a+b)²","(a−b)(a+b)","a(a−b)"],2,"平方差の公式 a²−b²=(a−b)(a+b)。"],["データ 2, 4, 4, 10 の中央値は？",["3","4","5","6"],1,"並べた中央2値4と4の平均なので中央値は4。"],["直角三角形で斜辺が5、他の一辺が3のとき、残りの辺は？",["2","3","4","√34"],2,"三平方の定理より残り²=5²−3²=16、長さは4。"],["確率で、同様に確からしい結果が8通りあり、条件に合う結果が3通りのとき確率は？",["3/8","5/8","1/3","3/5"],0,"確率＝条件に合う場合の数÷全場合の数＝3/8。"],["【データ読解】A組の平均点は70点、B組は75点だった。平均点だけから必ず言えることは？",["B組の全員がA組の全員より高得点","B組の平均点がA組より5点高い","B組の中央値も必ず5点高い","B組の点数の散らばりが小さい"],1,"平均の差は5点だが、個々の得点や中央値、散らばりは分からない。"],["【条件付き公式】√(x²)=x が成り立つ条件として正しいものは？",["すべての実数x","x≧0","x≦0","xが整数"],1,"一般には√(x²)=|x|。x≧0のときに限ってxと等しい。"],["【関数】y=x² のグラフをx軸方向に右へ3、y軸方向に上へ2だけ平行移動した式は？",["y=(x+3)²−2","y=(x−3)²+2","y=x²+5","y=(x+2)²+3"],1,"右へ3はxをx−3に置き換え、上へ2は+2する。"],["【確率】公平なコインを2回投げる。表がちょうど1回出る確率は？",["1/4","1/2","3/4","1"],1,"結果は表表・表裏・裏表・裏裏の4通りで、該当は2通り。"],["【三角関数】sin²θ+cos²θ の値は？",["0","1","sinθ","cosθ"],1,"三角関数の基本公式 sin²θ+cos²θ=1。"],["【三角関数】sin30° の値は？",["0","1/2","√2/2","1"],1,"特別な角の値より sin30°=1/2。"],["【指数・対数関数】2³ の値は？",["6","8","9","16"],1,"2³=2×2×2=8。"],["【指数・対数関数】log₂8 の値は？",["2","3","4","8"],1,"2³=8 なので log₂8=3。"],["【微分・積分】f(x)=x³ の導関数は？",["x²","2x","3x²","3x"],2,"べき関数の微分 (xⁿ)'=nxⁿ⁻¹ より 3x²。"],["【微分・積分】∫2x dx は？（積分定数をCとする）",["x²+C","2+C","2x²+C","x+C"],0,"∫2x dx=x²+C。"],["【極限】lim(x→0) sin x / x の値は？（xはラジアン）",["0","1","−1","存在しない"],1,"基本極限 lim(x→0) sin x/x=1（角度はラジアン）。"],["【微分法】f(x)=x² の x=3 における微分係数は？",["3","6","9","12"],1,"f'(x)=2x より f'(3)=6。"],["【積分法】∫₀¹ 2x dx の値は？",["0","1","2","4"],1,"原始関数はx²なので [x²]₀¹=1。"],["【図形と方程式】中心が原点、半径3の円の方程式は？",["x+y=3","x²+y²=9","x²−y²=9","x²+y²=3"],1,"中心が原点、半径rの円はx²+y²=r²。"],["【複素数と方程式】i² の値は？",["1","−1","i","−i"],1,"虚数単位iは i²=−1 を満たす。"],["【平面上の曲線】楕円 x²/4+y²=1 の長半径は？",["1","2","4","√5"],1,"標準形x²/a²+y²/b²=1では長半径は大きい方の半径。ここではa=2、b=1。"],["【複素数平面】複素数 z=3+4i の絶対値は？",["1","5","7","25"],1,"|z|=√(3²+4²)=5。"],["【三角関数】cos60° の値は？",["0","1/2","√3/2","1"],1,"特別な角では cos60°=1/2。"],["【指数・対数関数】2³×2² は？",["2⁵","2⁶","2⁹","4⁵"],0,"同じ底の積では指数を足すので2³×2²=2⁵。"],["【指数・対数関数】log₃1 の値は？",["−1","0","1","3"],1,"log₃1=0 は 3⁰=1 に対応する。"],["【微分・積分】∫x² dx は？",["2x+C","x³/3+C","x³+C","x²/2+C"],1,"べき関数の不定積分は指数を1増やして、その指数で割り、積分定数Cを付ける。"],["【極限】lim(x→0) (1−cos x)/x² の値は？（xはラジアン）",["0","1/2","1","存在しない"],1,"基本極限 lim(x→0)(1−cos x)/x²=1/2。"],["【微分法】f(x)=x³−2x の x=2 における微分係数は？",["8","10","12","14"],1,"f'(x)=3x²−2 なので f'(2)=12−2=10。"],["【積分法】∫₀² 3x² dx の値は？",["4","6","8","12"],2,"原始関数はx³。x=2で8、x=0で0なので8。"],["【図形と方程式】中心(1,−2)、半径3の円の方程式は？",["(x−1)²+(y+2)²=9","(x+1)²+(y−2)²=9","(x−1)²+(y+2)²=3","x²+y²=9"],0,"中心(a,b)、半径rの円は(x−a)²+(y−b)²=r²。"],["【複素数と方程式】(2+i)+(3−2i) は？",["5+3i","5−i","1−i","6−i"],1,"実部どうし、虚部どうしを足すので5−i。"],["【平面上の曲線】楕円 x²/9+y²/4=1 の長半径は？",["2","3","4","9"],1,"標準形の分母の平方根が半軸の長さなので長半径は3。"],["【複素数平面】2+3i の共役複素数は？",["−2+3i","2−3i","−2−3i","3+2i"],1,"共役複素数は虚部の符号だけを反転させるので2−3i。"],["【三角関数】sin²θ+cos²θ=1 を変形した式は？",["sin²θ=1−cos²θ","sinθ+cosθ=1","sin²θ−cos²θ=1","tanθ=1"],0,"sin²θ+cos²θ=1 より、sin²θ=1−cos²θ。"],["【微分・積分】f(x)=2x²+3x の導関数は？",["2x+3","4x+3","4x²+3","2x²"],1,"各項を微分すると(2x²)'=4x、(3x)'=3なので4x+3。"]];
const $=id=>document.getElementById(id);let questions=[],idx=0,answers=[],locked=false,reviewOnly=false;
const modes={formula:"公式・意味・使う条件・例を読む（問題は解きません）",shortcut:"裏技公式と適用条件・使い分けを読む（問題は解きません）",common:"条件・資料を読み取る共通テスト型問題",mock:"複数分野を解いて、正答率から弱点単元を確認します",basic:"基本事項を使って問題を解きます",truefalse:"公式が正しいか判断し、成立条件を確認します",proof:"証明の筋道を考え、根拠と結論を確認します",geometry:"図形の性質や条件を使って解きます"};

(function(){const p=new URLSearchParams(location.search),v=p.get("mode"),subs=(p.get("subjects")||"").split(",").filter(Boolean),units=(p.get("units")||"").split("|").filter(Boolean);if(["common","mock","basic","truefalse","proof","geometry","formula","shortcut"].includes(v))$("mode").value=v;const labels={"1":"数学Ⅰ","A":"数学A","2":"数学Ⅱ","B":"数学B","3":"数学Ⅲ","C":"数学C"};$("chosenSubjects").textContent="選択科目："+(subs.map(x=>labels[x]||x).join("・")||"未指定");$("chosenUnits").textContent="選択単元："+(units.join("・")||"全単元");document.querySelectorAll('input[name="mathUnit"]').forEach(x=>{x.checked=units.includes(x.value);});$("modeInfo").textContent=modes[$("mode").value]||modes.basic;if(units.length){$("unitInfo").textContent="選択した単元だけを優先して出題します。";}})();
function start(list=null,review=false){const mode=$("mode").value;if(!list&&(mode==="formula"||mode==="shortcut")){showFormulaLibrary(mode);return}let source=list||BANK;if(!list&&mode==="basic")source=BANK.filter(q=>/二次方程式|傾き|中央値|三平方/.test(q[0]));if(!list&&mode==="truefalse")source=[["正誤判定：すべての実数xについて √(x²)=x である。",[ "正しい","誤り"],1,"誤り。√(x²)=|x| であり、xが負ならxとは一致しない。"],["正誤判定：a²−b²=(a−b)(a+b) はすべての実数a,bで成り立つ。",["正しい","誤り"],0,"正しい。右辺を展開すると a²−b² になる。"],["正誤判定：二次方程式 ax²+bx+c=0 の解の公式は a≠0 のとき使う。",["正しい","誤り"],0,"正しい。a=0なら二次方程式ではなくなる。"]];if(!list&&mode==="proof")source=[["証明問題：nが偶数ならばn²は4の倍数であることを証明せよ。",["n=2k（kは整数）とおく","n²=(2k)²=4k²","k²は整数なので、n²は4の倍数"],0,"証明例：nは偶数なので n=2k（kは整数）と表せる。すると n²=4k²。k²は整数だから、n²は4の倍数である。"],["証明問題：二等辺三角形ABCでAB=ACのとき、底角∠ABC=∠BCAとなる理由を説明せよ。",["AB=ACより二等辺三角形である","二等辺三角形の底角は等しい","よって∠ABC=∠BCA"],0,"証明例：AB=ACなので△ABCは二等辺三角形である。二等辺三角形の底角は等しいから、∠ABC=∠BCA。"]];if(!list&&mode==="geometry")source=[["直角三角形の2辺が6 cm、8 cmのとき、斜辺の長さは？",["10 cm","12 cm","14 cm","√28 cm"],0,"三平方の定理より c²=6²+8²=100。長さは正なので c=10 cm。"],["半径5 cmの円で、中心から接点へ引いた半径と接線のなす角は？",["30°","45°","60°","90°"],3,"円の接点に引いた半径は接線に垂直なので90°。"],["座標平面でA(0,0)、B(3,4)間の距離は？",["4","5","6","7"],1,"距離は√((3−0)²+(4−0)²)=√25=5。"]];if(!list&&mode==="common")source=[["【共通テスト型・条件整理】実数xについて x²=9 を満たすxをすべて選ぶと？",["x=3のみ","x=−3のみ","x=±3","解なし"],2,"平方して9になる実数は3と−3の2つ。"],["【共通テスト型・データ読解】データ1,2,2,5,10の中央値と平均値の組は？",["中央値2、平均4","中央値4、平均2","中央値2、平均5","中央値5、平均4"],0,"中央値は中央の2。平均は合計20÷5=4。"],["【共通テスト型・確率】1〜4のカードから1枚を無作為に引く。偶数を引く確率は？",["1/4","1/2","3/4","1"],1,"偶数は2と4の2枚、全体は4枚なので2/4=1/2。"]];if(!list&&mode==="mock")source=[...BANK,...[["模擬テスト：3x−7=11 の解は？",["4","6","8","−6"],1,"3x=18より x=6。"],["模擬テスト：等差数列 4,7,10,… の第10項は？",["28","30","31","34"],2,"初項4、公差3なので a₁₀=4+9×3=31。"],["模擬テスト：AとBが同時に起こらないとき、P(A)=0.2、P(B)=0.3なら P(AまたはB)は？",["0.1","0.5","0.6","0.06"],1,"排反事象なので確率を足して0.2+0.3=0.5。"]]];const units=[...document.querySelectorAll('input[name="mathUnit"]:checked')].map(x=>x.value);if(!list&&units.length){const rules=[["数と式・二次方程式",["二次方程式","因数分解","平方差","条件として"]],["二次関数・グラフ",["関数 y=","グラフをx軸方向","傾き"]],["図形・三平方の定理",["三平方","直角三角形"]],["確率・場合の数",["確率","コイン"]],["データ分析",["中央値","平均点","データ"]],["数列・ベクトル",["数列","ベクトル"]],["三角関数",["【三角関数】","sin","cos","tan"]],["指数・対数関数",["【指数・対数関数】","log","2³"]],["微分・積分",["【微分・積分】"]],["極限",["【極限】","lim"]],["微分法",["【微分法】"]],["積分法",["【積分法】"]],["図形と方程式",["【図形と方程式】"]],["複素数と方程式",["【複素数と方程式】"]],["平面上の曲線",["【平面上の曲線】"]],["複素数平面",["【複素数平面】"]]];const terms=rules.filter(x=>units.includes(x[0])).flatMap(x=>x[1]);const filtered=source.filter(q=>terms.some(t=>q[0].toLowerCase().includes(t.toLowerCase())));if(filtered.length)source=filtered;else{source=[];$("unitInfo").textContent="選択した単元に一致する、この学習モードの問題はまだありません。別の単元か学習モードを選んでください。";}}questions=[...source].sort(()=>Math.random()-.5);if(!questions.length){$("unitInfo").textContent="このモード・単元の問題はまだ登録されていません。単元選択へ戻って別の範囲を選んでください。";return;}idx=0;answers=[];locked=false;reviewOnly=review;$("setup").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function showFormulaLibrary(mode){const formulas=[["数と式・二次方程式",[["平方差","a²−b²=(a−b)(a+b)","a²−b²の形を見つけたときに使う。例：x²−9=(x−3)(x+3)。"],["二次方程式の解の公式","x=(-b±√(b²−4ac))/(2a)","ax²+bx+c=0（a≠0）に使う。判別式 b²−4ac で実数解の個数も判断できる。"]]],["二次関数・グラフ",[["頂点形式","y=a(x−p)²+q","頂点は(p,q)。a>0なら下に凸、a<0なら上に凸。"],["軸","x=p","y=a(x−p)²+q の対称軸は x=p。"]]],["図形・三平方の定理",[["三平方の定理","a²+b²=c²","直角三角形で、cは斜辺。斜辺の長さは他の2辺から求める。"],["円の接線","接点への半径 ⟂ 接線","円の接点と中心を結ぶ半径は、接線と垂直になる。"]]],["確率・場合の数",[["確率","条件に合う場合の数 / 全場合の数","すべての結果が同様に確からしいときに使う。"],["順列","nPr=n!/(n−r)!","n個からr個を選んで順番に並べる。"]]],["データ分析",[["平均値","データの合計 / データの個数","外れ値の影響を受けやすい。中央値と合わせて分布を見る。"],["四分位範囲","第3四分位数 − 第1四分位数","中央50%のデータの広がりを表す。"]]],["数列・ベクトル",[["等差数列の一般項","aₙ=a₁+(n−1)d","初項a₁、公差d。隣り合う項の差が一定の数列。"],["ベクトルの大きさ","|a⃗|=√(x²+y²)","平面ベクトルが(x,y)のとき、三平方の定理で大きさを求める。"]]],["三角関数",[["基本公式","sin²θ+cos²θ=1","三角関数の基本関係。角度は文脈に応じてラジアン・度を区別する。"],["加法定理","sin(α±β)=sinαcosβ±cosαsinβ","角の和・差の三角関数を展開する。"]]],["指数・対数関数",[["指数法則","aᵐaⁿ=aᵐ⁺ⁿ","同じ底の積では指数を加える。"],["対数の定義","logₐx=y ⇔ aʸ=x","a>0、a≠1、x>0。対数を指数の形に直して考える。"]]],["微分・積分",[["べき関数の微分","(xⁿ)'=nxⁿ⁻¹","多項式の微分の基本。"],["不定積分","∫xⁿdx=xⁿ⁺¹/(n+1)+C","n≠−1。積分定数Cを忘れない。"]]],["極限",[["基本極限","lim(x→0) sin x/x=1","角度はラジアン。三角関数の極限で用いる。"]]],["微分法",[["微分係数","f'(a)=lim(h→0){f(a+h)−f(a)}/h","関数の瞬間的な変化率・接線の傾きを表す。"]]],["積分法",[["定積分の基本","∫ₐᵇ f(x)dx=F(b)−F(a)","F'=fとなる原始関数Fを用いる。"]]],["図形と方程式",[["円の方程式","(x−a)²+(y−b)²=r²","中心(a,b)、半径rの円を表す。"]]],["複素数と方程式",[["虚数単位","i²=−1","複素数の計算ではi²を−1に置き換える。"]]],["平面上の曲線",[["楕円の標準形","x²/a²+y²/b²=1","中心が原点の楕円。a,bは半軸の長さ。"]]],["複素数平面",[["複素数の絶対値","|a+bi|=√(a²+b²)","複素数平面上で原点から点(a,b)までの距離。"]]]];const chosen=[...document.querySelectorAll('input[name="mathUnit"]:checked')].map(x=>x.value);const show=chosen.length?formulas.filter(x=>chosen.includes(x[0])):formulas; $("setup").classList.add("hidden");$("quiz").classList.add("hidden");$("result").classList.add("hidden");let box=document.getElementById("formulaLibrary");if(!box){box=document.createElement("section");box.id="formulaLibrary";box.className="panel";$("setup").after(box)}box.classList.remove("hidden");box.innerHTML='<h2>'+(mode==="shortcut"?"裏技公式・使い分け":"公式・覚え方")+'</h2><p class="muted">選択した単元の公式、使う条件、例を確認できます。問題形式ではありません。</p>'+show.map(group=>'<section class="panel"><h3>'+group[0]+'</h3>'+group[1].map(f=>'<article class="explain" style="margin:12px 0"><h4>'+f[0]+'</h4><p style="font-size:1.2rem;font-weight:800">'+f[1]+'</p><p>'+f[2]+'</p></article>').join("")+'</section>').join("")+'<button id="backFormula">単元選択へ戻る</button>';$("backFormula").onclick=()=>{box.classList.add("hidden");$("setup").classList.remove("hidden")}}
function render(){const q=questions[idx];locked=false;$("counter").textContent=(idx+1)+" / "+questions.length;$("scoreLive").textContent="回答済み "+answers.filter(a=>a&&(a.selected!==undefined||a.written)).length+"問";$("bar").style.width=(idx/questions.length*100)+"%";$("question").textContent=q[0];$("choices").innerHTML="";if($("mode").value==="proof"){const ta=document.createElement("textarea");ta.id="proofAnswer";ta.rows=5;ta.style.cssText="width:100%;padding:14px;border-radius:10px;background:#091a2e;color:var(--txt);border:1px solid #355575;font:inherit";ta.placeholder="仮定・根拠・結論を使って、自分の言葉で証明を書こう";$("choices").appendChild(ta)}else{q[1].forEach((t,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=["A","B","C","D"][i]+"．"+t;b.addEventListener("click",()=>{if(locked)return;answers[idx]={selected:i};[...$("choices").children].forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});$("choices").appendChild(b)})}$("feedback").classList.add("hidden");$("feedback").textContent="";$("check").disabled=false;$("next").disabled=true;$("next").textContent=idx===questions.length-1?"結果を見る":"次の問題 →"}
$("start").addEventListener("click",()=>{const selected=$("mode").value;if(selected==="formula"||selected==="shortcut"){showFormulaLibrary(selected);return;}start();});
$("check").addEventListener("click",()=>{if(locked)return;const q=questions[idx];if($("mode").value==="proof"){const written=$("proofAnswer")?.value.trim()||"";if(!written){$("feedback").textContent="まず証明を書いてみよう。";$("feedback").classList.remove("hidden");return}answers[idx]={written,selected:0,correct:/n=2k|4k²|底角|二等辺三角形|よって|したがって/.test(written)};locked=true;$("feedback").textContent="解答例："+q[3]+"\n\n自分の答案に、仮定・根拠・結論がそろっているか照らし合わせよう。自動採点ではなく、解答例との比較で確認してください。";$("feedback").classList.remove("hidden");$("check").disabled=true;$("next").disabled=false;return}if(!answers[idx]||answers[idx].selected===undefined){$("feedback").textContent="選択肢を選んでね。";$("feedback").classList.remove("hidden");return}locked=true;const a=answers[idx];a.correct=a.selected===q[2];[...$("choices").children].forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add("correct");if(i===a.selected&&i!==q[2])b.classList.add("wrong")});$("feedback").textContent=(a.correct?"正解！":"不正解。正解は "+["A","B","C","D"][q[2]]+"。")+" "+q[3];$("feedback").classList.remove("hidden");$("check").disabled=true;$("next").disabled=false;$("scoreLive").textContent="現在 "+answers.filter(x=>x&&x.correct).length+"問正解"});
$("next").addEventListener("click",()=>{if(idx<questions.length-1){idx++;render()}else finish()});
function finish(){ $("quiz").classList.add("hidden");$("result").classList.remove("hidden");const good=answers.filter(a=>a&&a.correct).length;const wrong=questions.map((q,i)=>({q,a:answers[i]})).filter(x=>!x.a||!x.a.correct);const weak=wrong.reduce((acc,x)=>{const s=x.q[0];const k=/確率|コイン/.test(s)?"確率・場合の数":/中央値|平均点|データ/.test(s)?"データ分析":/三平方|直角三角形/.test(s)?"図形・三平方の定理":/関数|傾き|グラフ/.test(s)?"二次関数・グラフ":"数と式・二次方程式";acc[k]=(acc[k]||0)+1;return acc;},{});localStorage.setItem("highschoolMathWeakness",JSON.stringify(weak));$("summary").textContent=good+" / "+questions.length+"問正解（正答率 "+Math.round(good/questions.length*100)+"%）";$("analysis").textContent=(good===questions.length?"全問正解！":"間違えた問題を復習しよう。")+" 弱点単元："+(Object.keys(weak).length?Object.entries(weak).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+"（"+v+"問）").join("、"):"なし");$("missed").innerHTML=wrong.length?wrong.map(x=>'<div class="explain" style="margin:10px 0"><strong>'+x.q[0]+'</strong><p>正解：'+x.q[1][x.q[2]]+'</p><p>'+x.q[3]+'</p></div>').join(""):"間違えた問題はありません。";$("review").disabled=!wrong.length;$("review").onclick=()=>start(wrong.map(x=>x.q),true);$("again").onclick=()=>start()}
/* practice-query-unit */const qp=new URLSearchParams(window.location.search);const requestedMode=qp.get("mode");if(["common","mock","basic","truefalse","proof","geometry","formula","shortcut"].includes(requestedMode)){ $("mode").value=requestedMode; $("mode").dispatchEvent(new Event("change",{bubbles:true})); }const requestedLabel=qp.get("label");if(requestedLabel){const h=document.querySelector("h1");if(h)h.textContent=requestedLabel+"｜演習ラボ";}</script></body></html>
