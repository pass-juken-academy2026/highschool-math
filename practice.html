</style><style id="responsive-layout-polish">/* Responsive layout and touch-target polish; learning data unchanged. */*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:5rem}body{max-width:100%;overflow-wrap:anywhere}img,svg,canvas,video{max-width:100%;height:auto}button,input,select,textarea{font:inherit;max-width:100%;min-width:0}button,a,[role="button"]{touch-action:manipulation}button{min-height:42px}:where(button,a,input,select,textarea,[role="button"],[tabindex]):focus-visible{outline:3px solid #65c9f1;outline-offset:3px}@media(max-width:640px){body{font-size:16px;line-height:1.65}header,main{padding-left:max(16px,env(safe-area-inset-left))!important;padding-right:max(16px,env(safe-area-inset-right))!important}h1{font-size:clamp(1.55rem,7vw,2.25rem)!important;line-height:1.2}h2{font-size:clamp(1.15rem,5vw,1.45rem)}.grid,.cards,.subject-grid,.subjects,.menu-grid,.topic-grid,.cards-grid,.dashboard,.two-col,.three-col{grid-template-columns:minmax(0,1fr)!important}.card,.panel,.topic-card,.menu-card{min-width:0;overflow-wrap:anywhere}button{min-height:44px}.choices button{width:100%;text-align:left;white-space:normal}table{display:block;max-width:100%;overflow-x:auto}pre,code{overflow-wrap:anywhere;white-space:pre-wrap}input,select,textarea{font-size:16px}}</style></head><body><main><div class="top"><a href="./index.html">← 科目トップへ戻る</a><span class="pill">オリジナル問題</span></div><h1>高校数学 演習ラボ</h1><p class="muted">知識の確認から資料・文章を読み取る問題まで。解答後に採点し、解説と復習問題を確認できます。</p><section class="panel" id="setup"><h2>選択内容</h2><p id="chosenSubjects" class="muted"></p><p id="chosenUnits" class="muted"></p><fieldset id="unitChoices" style="border:0;padding:0;margin:12px 0"><legend>学習する単元（複数選択可）</legend><label><input type="checkbox" name="mathUnit" value="数と式・二次方程式"> 数と式・二次方程式</label><br><label><input type="checkbox" name="mathUnit" value="二次関数・グラフ"> 二次関数・グラフ</label><br><label><input type="checkbox" name="mathUnit" value="図形・三平方の定理"> 図形・三平方の定理</label><br><label><input type="checkbox" name="mathUnit" value="確率・場合の数"> 確率・場合の数</label><br><label><input type="checkbox" name="mathUnit" value="データ分析"> 統計的な推測（データ分析）</label><br><label><input type="checkbox" name="mathUnit" value="数列"> 数列</label><br><label><input type="checkbox" name="mathUnit" value="ベクトル"> ベクトル</label><br><label><input type="checkbox" name="mathUnit" value="三角関数"> 三角関数</label><br><label><input type="checkbox" name="mathUnit" value="指数・対数関数"> 指数・対数関数</label><br><label><input type="checkbox" name="mathUnit" value="微分・積分"> 微分・積分</label><br><label><input type="checkbox" name="mathUnit" value="極限"> 極限</label><br><label><input type="checkbox" name="mathUnit" value="微分法"> 微分法</label><br><label><input type="checkbox" name="mathUnit" value="積分法"> 積分法</label><br><label><input type="checkbox" name="mathUnit" value="図形と方程式"> 図形と方程式</label><br><label><input type="checkbox" name="mathUnit" value="複素数と方程式"> 複素数と方程式</label><br><label><input type="checkbox" name="mathUnit" value="平面上の曲線"> 平面上の曲線</label><br><label><input type="checkbox" name="mathUnit" value="複素数平面"> 複素数平面</label></fieldset><p id="unitInfo" class="muted">選んだ単元から出題します。</p><label for="mode">学習方法</label><select id="mode"><option value="formula">1. 公式・覚え方を見る</option><option value="shortcut">A. 裏技公式・使い分けを見る</option><option value="basic">2. 基本問題</option><option value="truefalse">B. 公式の正誤問題</option><option value="geometry">3. 応用・図形問題</option><option value="common">C. 共通テスト型演習（数学Ⅰ・A）</option><option value="common2bc">C1. 共通テスト型演習（数学Ⅱ・B・C）</option><option value="individual">C2. 数学Ⅲ・個別試験型</option><option value="method">問題に合う解法を選ぶ</option><option value="steps">途中式の確認</option><option value="similar">類題演習</option><option value="visual">グラフ・図形で理解</option><option value="proof">証明問題</option><option value="mock">模擬テスト・弱点分析</option></select><p id="modeInfo" class="muted"></p><button id="start">選んだ内容で始める</button></section><section class="panel hidden" id="quiz" aria-live="polite"><div class="top"><span id="counter" class="pill"></span><span id="scoreLive" class="muted"></span></div><div class="progress"><span id="bar"></span></div><h2 id="question"></h2><div id="visualAid" class="explain hidden" aria-label="グラフ・図形の図解"></div><div id="choices"></div><div id="feedback" class="explain hidden"></div><div class="row" style="margin-top:18px"><button id="check">解答する</button><button id="next" disabled>次の問題 →</button></div></section><section class="panel hidden" id="result"><h2>結果・弱点分析</h2><p id="summary"></p><p id="analysis" class="muted"></p><h3>間違えた問題</h3><div id="missed"></div><div class="row"><button id="review">間違えた問題を復習</button><button id="again">もう一度挑戦</button></div></section><p class="muted">※本番問題の転載ではなく、学習用に作成したオリジナル問題です。出題範囲は今後拡充します。</p></main><script>
const BANK=[["二次方程式 x²−5x+6=0 の解は？",["x=1,6","x=−2,−3","x=2,3","x=−1,−6"],2,"(x−2)(x−3)=0 より x=2,3。"],["関数 y=2x+1 の傾きは？",["1","2","−2","−1"],1,"y=ax+b の傾きは x の係数 a。"],["a²−b² を因数分解すると？",["(a−b)²","(a+b)²","(a−b)(a+b)","a(a−b)"],2,"平方差の公式 a²−b²=(a−b)(a+b)。"],["データ 2, 4, 4, 10 の中央値は？",["3","4","5","6"],1,"並べた中央2値4と4の平均なので中央値は4。"],["直角三角形で斜辺が5、他の一辺が3のとき、残りの辺は？",["2","3","4","√34"],2,"三平方の定理より残り²=5²−3²=16、長さは4。"],["確率で、同様に確からしい結果が8通りあり、条件に合う結果が3通りのとき確率は？",["3/8","5/8","1/3","3/5"],0,"確率＝条件に合う場合の数÷全場合の数＝3/8。"],["【データ読解】A組の平均点は70点、B組は75点だった。平均点だけから必ず言えることは？",["B組の全員がA組の全員より高得点","B組の平均点がA組より5点高い","B組の中央値も必ず5点高い","B組の点数の散らばりが小さい"],1,"平均の差は5点だが、個々の得点や中央値、散らばりは分からない。"],["【条件付き公式】√(x²)=x が成り立つ条件として正しいものは？",["すべての実数x","x≧0","x≦0","xが整数"],1,"一般には√(x²)=|x|。x≧0のときに限ってxと等しい。"],["【関数】y=x² のグラフをx軸方向に右へ3、y軸方向に上へ2だけ平行移動した式は？",["y=(x+3)²−2","y=(x−3)²+2","y=x²+5","y=(x+2)²+3"],1,"右へ3はxをx−3に置き換え、上へ2は+2する。"],["【確率】公平なコインを2回投げる。表がちょうど1回出る確率は？",["1/4","1/2","3/4","1"],1,"結果は表表・表裏・裏表・裏裏の4通りで、該当は2通り。"],["【三角関数】sin²θ+cos²θ の値は？",["0","1","sinθ","cosθ"],1,"三角関数の基本公式 sin²θ+cos²θ=1。"],["【三角関数】sin30° の値は？",["0","1/2","√2/2","1"],1,"特別な角の値より sin30°=1/2。"],["【指数・対数関数】2³ の値は？",["6","8","9","16"],1,"2³=2×2×2=8。"],["【指数・対数関数】log₂8 の値は？",["2","3","4","8"],1,"2³=8 なので log₂8=3。"],["【微分・積分】f(x)=x³ の導関数は？",["x²","2x","3x²","3x"],2,"べき関数の微分 (xⁿ)'=nxⁿ⁻¹ より 3x²。"],["【微分・積分】∫2x dx は？（積分定数をCとする）",["x²+C","2+C","2x²+C","x+C"],0,"∫2x dx=x²+C。"],["【極限】lim(x→0) sin x / x の値は？（xはラジアン）",["0","1","−1","存在しない"],1,"基本極限 lim(x→0) sin x/x=1（角度はラジアン）。"],["【微分法】f(x)=x² の x=3 における微分係数は？",["3","6","9","12"],1,"f'(x)=2x より f'(3)=6。"],["【積分法】∫₀¹ 2x dx の値は？",["0","1","2","4"],1,"原始関数はx²なので [x²]₀¹=1。"],["【図形と方程式】中心が原点、半径3の円の方程式は？",["x+y=3","x²+y²=9","x²−y²=9","x²+y²=3"],1,"中心が原点、半径rの円はx²+y²=r²。"],["【複素数と方程式】i² の値は？",["1","−1","i","−i"],1,"虚数単位iは i²=−1 を満たす。"],["【平面上の曲線】楕円 x²/4+y²=1 の長半径は？",["1","2","4","√5"],1,"標準形x²/a²+y²/b²=1では長半径は大きい方の半径。ここではa=2、b=1。"],["【複素数平面】複素数 z=3+4i の絶対値は？",["1","5","7","25"],1,"|z|=√(3²+4²)=5。"],["【三角関数】cos60° の値は？",["0","1/2","√3/2","1"],1,"特別な角では cos60°=1/2。"],["【指数・対数関数】2³×2² は？",["2⁵","2⁶","2⁹","4⁵"],0,"同じ底の積では指数を足すので2³×2²=2⁵。"],["【指数・対数関数】log₃1 の値は？",["−1","0","1","3"],1,"log₃1=0 は 3⁰=1 に対応する。"],["【微分・積分】∫x² dx は？",["2x+C","x³/3+C","x³+C","x²/2+C"],1,"べき関数の不定積分は指数を1増やして、その指数で割り、積分定数Cを付ける。"],["【極限】lim(x→0) (1−cos x)/x² の値は？（xはラジアン）",["0","1/2","1","存在しない"],1,"基本極限 lim(x→0)(1−cos x)/x²=1/2。"],["【微分法】f(x)=x³−2x の x=2 における微分係数は？",["8","10","12","14"],1,"f'(x)=3x²−2 なので f'(2)=12−2=10。"],["【積分法】∫₀² 3x² dx の値は？",["4","6","8","12"],2,"原始関数はx³。x=2で8、x=0で0なので8。"],["【図形と方程式】中心(1,−2)、半径3の円の方程式は？",["(x−1)²+(y+2)²=9","(x+1)²+(y−2)²=9","(x−1)²+(y+2)²=3","x²+y²=9"],0,"中心(a,b)、半径rの円は(x−a)²+(y−b)²=r²。"],["【複素数と方程式】(2+i)+(3−2i) は？",["5+3i","5−i","1−i","6−i"],1,"実部どうし、虚部どうしを足すので5−i。"],["【平面上の曲線】楕円 x²/9+y²/4=1 の長半径は？",["2","3","4","9"],1,"標準形の分母の平方根が半軸の長さなので長半径は3。"],["【複素数平面】2+3i の共役複素数は？",["−2+3i","2−3i","−2−3i","3+2i"],1,"共役複素数は虚部の符号だけを反転させるので2−3i。"],["【三角関数】sin²θ+cos²θ=1 を変形した式は？",["sin²θ=1−cos²θ","sinθ+cosθ=1","sin²θ−cos²θ=1","tanθ=1"],0,"sin²θ+cos²θ=1 より、sin²θ=1−cos²θ。"],["【微分・積分】f(x)=2x²+3x の導関数は？",["2x+3","4x+3","4x²+3","2x²"],1,"各項を微分すると(2x²)'=4x、(3x)'=3なので4x+3。"],["【図形と計量】直角三角形で、角θの向かいの辺が3、斜辺が5のとき sinθ は？",["3/5","4/5","5/3","3/4"],0,"sinθ=（角の向かいの辺）÷（斜辺）=3/5。"],["【図形と計量】直角三角形で、角θに隣り合う直角辺が4、斜辺が5のとき cosθ は？",["3/5","4/5","5/4","4/3"],1,"cosθ=（角に隣り合う直角辺）÷（斜辺）=4/5。"],["【図形と計量】直角三角形で、角θの向かいの辺が3、隣り合う直角辺が4のとき tanθ は？",["3/4","4/3","3/5","4/5"],0,"tanθ=（角の向かいの辺）÷（角に隣り合う直角辺）=3/4。"],["【一次不等式】3x−7<5 を満たすxの範囲は？",["x<−4","x<4","x>4","x>−4"],1,"両辺に7を足すと3x<12。3で割ってx<4。"],["【絶対値】|x−2|=3 の実数解は？",["x=1,5","x=−1,5","x=−5,1","x=−1,2"],1,"x−2=±3よりx=5またはx=−1。"],["【分数式】(x²−9)/(x−3) を簡単にした式として正しいものは？",["x−3（ただしx≠3）","x+3（ただしx≠3）","x+3（すべての実数）","x²+3"],1,"x²−9=(x−3)(x+3)。約分後も元の条件x≠3を保つ。"],["【整式の除法】P(x)=x³−2x+1 を x−2 で割った余りは？",["1","3","5","9"],2,"余りの定理よりP(2)=8−4+1=5。"],["【恒等式】x²+px+4=(x+2)² が恒等式となるpは？",["−4","−2","2","4"],3,"右辺を展開するとx²+4x+4なのでp=4。"],["【不等式の証明】実数a,bについて a²+b²−2ab は必ず？",["負である","0以上である","1以上である","常に0である"],1,"a²+b²−2ab=(a−b)²≥0。等号はa=bのとき。"],["【期待値】Xが0,1,2をそれぞれ確率0.2,0.5,0.3で取るとき、E(X)は？",["0.8","1.0","1.1","1.5"],2,"E(X)=0×0.2+1×0.5+2×0.3=1.1。"],["【数列・漸化式】a₁=2、aₙ₊₁=aₙ+3 のとき a₆ は？",["14","15","17","20"],2,"初項2から5回3ずつ増えるのでa₆=2+5×3=17。"],["【数列・和】初項2、公比3の等比数列の初めの4項の和は？",["40","60","80","120"],2,"2+6+18+54=80。"],["【三角関数】0≤θ<2πで sinθ=1/2 を満たすθは？",["π/6のみ","π/6, 5π/6","π/3, 2π/3","7π/6, 11π/6"],1,"単位円で正弦が1/2になるのはπ/6、5π/6。"],["【指数方程式】2^(x+1)=16 を満たすxは？",["2","3","4","5"],1,"16=2⁴なのでx+1=4、x=3。"],["【対数方程式】log₂(x−1)=3 の解は？",["x=7","x=8","x=9","x=−7"],2,"真数条件x>1。x−1=2³=8よりx=9。"],["【位置ベクトル】AP:PB=1:2、OA⃗=a、OB⃗=b のときOP⃗は？",["(a+2b)/3","(2a+b)/3","(a+b)/2","2a−b"],1,"内分点は反対側の比を係数に置くのでOP⃗=(2a+b)/3。"],["【空間ベクトル】ベクトル(2,−1,2)の大きさは？",["√5","3","5","9"],1,"大きさは√(2²+(−1)²+2²)=√9=3。"],["【二階導関数】f(x)=x³−3x の二階導関数は？",["3x²−3","6x","6x−3","x²−3"],1,"f'(x)=3x²−3、さらに微分してf''(x)=6x。"],["【回転体】y=x、0≤x≤1で囲まれた領域をx軸の周りに回転した体積は？",["π/6","π/3","π/2","π"],1,"V=π∫₀¹x²dx=π/3。"],["【極限】lim(n→∞)(1/2)ⁿ の値は？",["−1","0","1/2","発散する"],1,"公比の絶対値が1未満なので0に収束する。"],["【媒介変数】x=t²、y=t³で t≠0 のとき dy/dx は？",["2t/3","3t/2","3t²/2","2t²/3"],1,"dy/dt=3t²、dx/dt=2tよりdy/dx=3t/2。"],["【円と直線】半径5の円で、中心から直線までの距離がちょうど5のとき共有点は？",["0個","1個","2個","無数"],1,"中心から直線までの距離が半径と等しいので接し、共有点は1個。"],["【場合の数】7人から委員を3人選ぶ方法は何通り？",["21","35","210","343"],1,"順序を区別しないので₇C₃=7×6×5/(3×2×1)=35。"],["【反復試行】成功確率1/2の試行を3回独立に行う。成功がちょうど2回の確率は？",["1/8","3/8","1/2","3/4"],1,"₃C₂(1/2)²(1/2)=3/8。"],["【データ分析】相関係数 r=−0.92 の説明として最も適切なのは？",["強い正の線形相関","強い負の線形相関","線形相関がないと断定できる","因果関係が証明される"],1,"−1に近い相関係数は強い負の線形相関を示すが、因果関係までは証明しない。"],["【微分法】f(x)=x²sin x の導関数は？",["2x cos x","2x sin x+x² cos x","x² cos x","2x sin x−x² cos x"],1,"積の微分法よりf'(x)=2x sin x+x² cos x。"],["【積分法】∫₀² 4x³ dx の値は？",["8","12","16","20"],2,"原始関数はx⁴なので[x⁴]₀²=16。"],["【複素数平面】z=2(cos(π/3)+i sin(π/3)) の絶対値は？",["1","2","√3","4"],1,"極形式の絶対値は係数rなので2。"],

function showFormulaLibrary(mode){const formulas=[["数と式・二次方程式",[["平方差","a²−b²=(a−b)(a+b)","a²−b²の形を見つけたときに使う。例：x²−9=(x−3)(x+3)。"],["二次方程式の解の公式","x=(-b±√(b²−4ac))/(2a)","ax²+bx+c=0（a≠0）に使う。判別式 b²−4ac で実数解の個数も判断できる。"]]],["二次関数・グラフ",[["頂点形式","y=a(x−p)²+q","頂点は(p,q)。a>0なら下に凸、a<0なら上に凸。"],["軸","x=p","y=a(x−p)²+q の対称軸は x=p。"]]],["図形・三平方の定理",[["三平方の定理","a²+b²=c²","直角三角形で、cは斜辺。斜辺の長さは他の2辺から求める。"],["円の接線","接点への半径 ⟂ 接線","円の接点と中心を結ぶ半径は、接線と垂直になる。"]]],["確率・場合の数",[["確率","条件に合う場合の数 / 全場合の数","すべての結果が同様に確からしいときに使う。"],["順列","nPr=n!/(n−r)!","n個からr個を選んで順番に並べる。"]]],["データ分析",[["平均値","データの合計 / データの個数","外れ値の影響を受けやすい。中央値と合わせて分布を見る。"],["四分位範囲","第3四分位数 − 第1四分位数","中央50%のデータの広がりを表す。"]]],["数列・ベクトル",[["等差数列の一般項","aₙ=a₁+(n−1)d","初項a₁、公差d。隣り合う項の差が一定の数列。"],["ベクトルの大きさ","|a⃗|=√(x²+y²)","平面ベクトルが(x,y)のとき、三平方の定理で大きさを求める。"]]],["三角関数",[["基本公式","sin²θ+cos²θ=1","三角関数の基本関係。角度は文脈に応じてラジアン・度を区別する。"],["加法定理","sin(α±β)=sinαcosβ±cosαsinβ","角の和・差の三角関数を展開する。"]]],["指数・対数関数",[["指数法則","aᵐaⁿ=aᵐ⁺ⁿ","同じ底の積では指数を加える。"],["対数の定義","logₐx=y ⇔ aʸ=x","a>0、a≠1、x>0。対数を指数の形に直して考える。"]]],["微分・積分",[["べき関数の微分","(xⁿ)'=nxⁿ⁻¹","多項式の微分の基本。"],["不定積分","∫xⁿdx=xⁿ⁺¹/(n+1)+C","n≠−1。積分定数Cを忘れない。"]]],["極限",[["基本極限","lim(x→0) sin x/x=1","角度はラジアン。三角関数の極限で用いる。"]]],["微分法",[["微分係数","f'(a)=lim(h→0){f(a+h)−f(a)}/h","関数の瞬間的な変化率・接線の傾きを表す。"]]],["積分法",[["定積分の基本","∫ₐᵇ f(x)dx=F(b)−F(a)","F'=fとなる原始関数Fを用いる。"]]],["図形と方程式",[["円の方程式","(x−a)²+(y−b)²=r²","中心(a,b)、半径rの円を表す。"]]],["複素数と方程式",[["虚数単位","i²=−1","複素数の計算ではi²を−1に置き換える。"]]],["平面上の曲線",[["楕円の標準形","x²/a²+y²/b²=1","中心が原点の楕円。a,bは半軸の長さ。"]]],["複素数平面",[["複素数の絶対値","|a+bi|=√(a²+b²)","複素数平面上で原点から点(a,b)までの距離。"]]]];const chosen=[...document.querySelectorAll('input[name="mathUnit"]:checked')].map(x=>x.value);const show=chosen.length?formulas.filter(x=>chosen.includes(x[0])):formulas; $("setup").classList.add("hidden");$("quiz").classList.add("hidden");$("result").classList.add("hidden");let box=document.getElementById("formulaLibrary");if(!box){box=document.createElement("section");box.id="formulaLibrary";box.className="panel";$(
