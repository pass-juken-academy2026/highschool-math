name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML and inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, sys, tempfile
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.ids=[]; self.scripts=[]; self.in_script=False; self.buf=[]; self.errors=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.append(a['id'])
                  if tag=='script': self.in_script=True; self.buf=[]
              def handle_data(self, data):
                  if self.in_script: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag=='script' and self.in_script:
                      self.scripts.append(''.join(self.buf)); self.in_script=False
          files=list(Path('.').rglob('*.html'))
          if not files: print('No HTML files found'); sys.exit(1)
          failed=False
          for f in files:
              a=Audit()
              try: a.feed(f.read_text(encoding='utf-8'))
              except Exception as e: print(f'HTML parse error {f}: {e}'); failed=True; continue
              dup=sorted({i for i in a.ids if a.ids.count(i)>1})
              if dup: print(f'Duplicate IDs in {f}: {dup}'); failed=True
              for n,js in enumerate(a.scripts):
                  if not js.strip(): continue
                  p=Path(tempfile.gettempdir())/f'inline-{abs(hash((str(f),n)))}.js'
                  p.write_text(js,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if r.returncode: print(f'JavaScript syntax error in {f} script {n+1}:\n{r.stderr}'); failed=True
              print(f'Checked {f}: {len(a.scripts)} inline script(s), {len(a.ids)} IDs')
          if failed: sys.exit(1)
          PY

      - name: Check Stage 2 mathematics feature coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          home = Path('index.html').read_text(encoding='utf-8')
          practice = Path('practice.html').read_text(encoding='utf-8')
          required_home = [
              'value="method"', 'value="steps"', 'value="similar"', 'value="visual"',
              '問題に合う解法を選ぶ', '途中式の確認', '類題演習', 'グラフ・図形で理解',
          ]
          required_practice = [
              'if(!list&&mode==="method")', 'if(!list&&mode==="steps")',
              'if(!list&&mode==="similar")', 'if(!list&&mode==="visual")',
              'function mathVisualFor(', 'name="proof-check"',
              '三平方の定理', '正解は34（C）',
          ]
          missing = [f'index.html: {x}' for x in required_home if x not in home]
          missing += [f'practice.html: {x}' for x in required_practice if x not in practice]
          if missing:
              print('Missing Stage 2 mathematics coverage:')
              print('\n'.join(missing))
              sys.exit(1)
          print(f'Checked {len(required_home) + len(required_practice)} Stage 2 mathematics coverage markers')
          PY
      - name: Validate Stage 2 mathematics answer data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          source = Path('practice.html').read_text(encoding='utf-8')
          pattern = re.compile(r'\["((?:\\.|[^"\\])*)",\[((?:\\.|[^\]])*)\],(\d+),"((?:\\.|[^"\\])*)"\]')
          records = pattern.findall(source)
          errors = []
          for n, (_, raw_choices, raw_answer, explanation) in enumerate(records, 1):
              choices = re.findall(r'"((?:\\.|[^"\\])*)"', raw_choices)
              answer = int(raw_answer)
              if len(choices) < 2 or answer < 0 or answer >= len(choices):
                  errors.append(f'question {n}: choices={len(choices)}, answer index={answer}')
              if len(explanation.strip()) < 8:
                  errors.append(f'question {n}: missing or too-short explanation')
          if len(records) < 60:
              errors.append(f'expected at least 60 question records, found {len(records)}')
          if errors:
              print('Invalid Stage 2 mathematics answer data:')
              print('\n'.join(errors))
              sys.exit(1)
          print(f'Validated {len(records)} mathematics question records: answer indices and explanations OK')
          PY
