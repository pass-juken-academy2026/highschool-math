<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高校数学｜学習メニュー</title>
<style>
:root{color-scheme:dark;--bg:#071426;--panel:#10233d;--line:#294563;--txt:#edf5ff;--muted:#c3d5e9;--accent:#7bdcff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#14345a 0,transparent 48%),var(--bg);color:var(--txt);font:16px/1.65 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:22px}h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.2}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.subject{display:flex;gap:10px;align-items:center;border:1px solid #355575;border-radius:12px;padding:14px;background:#091a2e;font-weight:800}.subject input{width:22px;height:22px;accent-color:#7bdcff}.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.unit{display:flex;gap:9px;align-items:flex-start;padding:12px;border-radius:10px;background:#091a2e;border:1px solid #294563}.unit input{margin-top:5px;accent-color:#7bdcff}button{font:inherit;font-weight:800;border-radius:10px;padding:13px 18px;border:1px solid #438bb0;background:#17658b;color:#fff;cursor:pointer;min-height:48px;width:100%}.disabled{opacity:.45}@media(max-width:540px){main{padding:14px}.panel{padding:15px}.grid,.units{grid-template-columns:1fr}}
</style><style id="responsive-layout-polish">
/* Responsive layout and touch-target polish; content and learning data are unchanged. */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:5rem}
body{max-width:100%;overflow-wrap:anywhere}
img,svg,canvas,video{max-width:100%;height:auto}
button,input,select,textarea{font:inherit;max-width:100%;min-width:0}
button,a,[role="button"]{touch-action:manipulation}
button{min-height:42px}
:where(button,a,input,select,textarea,[role="button"],[tabindex]):focus-visible{outline:3px solid #65c9f1;outline-offset:3px}
@media(max-width:640px){
  body{font-size:16px;line-height:1.65}
  header,main{padding-left:max(16px,env(safe-area-inset-left))!important;padding-right:max(16px,env(safe-area-inset-right))!important}
  h1{font-size:clamp(1.55rem,7vw,2.25rem)!important;line-height:1.2}
  h2{font-size:clamp(1.15rem,5vw,1.45rem)}
  .grid,.cards,.subject-grid,.subjects,.menu-grid,.topic-grid,.cards-grid,.dashboard,.two-col,.three-col{grid-template-columns:minmax(0,1fr)!important}
  .card,.panel,.topic-card,.menu-card{min-width:0;overflow-wrap:anywhere}
  button{min-height:44px}
  .choices button{width:100%;text-align:left;white-space:normal}
  table{display:block;max-width:100%;overflow-x:auto}
  pre,code{overflow-wrap:anywhere;white-space:pre-wrap}
  input,select,textarea{font-size:16px}
}
</style></head><body><main><p class="muted">PASS JUKEN ACADEMY · 高校数学</p><h1>高校数学 学習メニュー</h1><p class="muted">① 数学の科目を選ぶ → ② 学習する単元を選ぶ → ③ 学習方法を選んで始める。選んだ範囲だけを学習できます。</p>
<section class="panel"><h2>① 科目を選択</h2><p class="muted">複数選択できます。</p><div class="grid" id="subjects">
<label class="subject"><input type="checkbox" value="1">数学Ⅰ</label><label class="subject"><input type="checkbox" value="A">数学A</label>
<label class="subject"><input type="checkbox" value="2">数学Ⅱ</label><label class="subject"><input type="checkbox" value="B">数学B</label>
<label class="subject"><input type="checkbox" value="3">数学Ⅲ</label><label class="subject"><input type="checkbox" value="C">数学C</label></div></section>
<section class="panel"><h2>② 単元を選択</h2><p class="muted">科目を選ぶと、対応する単元が表示されます。複数選択OK。</p><div id="units" class="units"><p class="muted">先に科目を選んでください。</p></div></section>
<section class="panel"><h2>③ 学習方法を選択</h2><label for="mode">学習モード</label><select id="mode" style="width:100%;font:inherit;padding:12px;border-radius:10px;background:#091a2e;color:white;border:1px solid #355575"><option value="formula">1. 公式・覚え方を見る</option><option value="shortcut">A. 裏技公式・使い分けを見る</option><option value="basic">2. 基本問題を解く</option><option value="truefalse">B. 公式の正誤問題</option><option value="geometry">3. 応用・図形問題</option><option value="common">C. 共通テスト型演習</option><option value="proof">証明問題</option><option value="mock">模擬テスト・弱点分析</option></select><p class="muted" id="modeInfo">公式・意味・使う条件・例を確認します。</p><button id="start">選んだ範囲で始める</button><p id="error" role="status" class="muted"></p></section>
</main><script>
const map={
"1":[["数と式・二次方程式","数と式・二次方程式"],["二次関数・グラフ","二次関数・グラフ"],["図形と計量","図形・三平方の定理"],["データの分析","データ分析"]],
"A":[["場合の数と確率","確率・場合の数"],["図形の性質","図形・三平方の定理"],["整数の性質","数と式・二次方程式"]],
"2":[["式と証明","数と式・二次方程式"],["複素数と方程式","複素数と方程式"],["図形と方程式","図形と方程式"],["三角関数","三角関数"],["指数・対数関数","指数・対数関数"],["微分・積分","微分・積分"]],
"B":[["数列","数列・ベクトル"],["統計的な推測","データ分析"]],
"3":[["極限","極限"],["微分法","微分法"],["積分法","積分法"]],
"C":[["ベクトル","数列・ベクトル"],["平面上の曲線","平面上の曲線"],["複素数平面","複素数平面"]]
};
const units=document.getElementById("units");
function renderUnits(){const selected=[...document.querySelectorAll('#subjects input:checked')].map(x=>x.value);const all=new Map();selected.forEach(s=>(map[s]||[]).forEach(([label,value])=>all.set(label,value)));units.innerHTML=all.size?[...all].map(([label,value])=>'<label class="unit"><input type="checkbox" name="unit" value="'+value+'"><span>'+label+'</span></label>').join(""):'<p class="muted">先に科目を選んでください。</p>';}
document.querySelectorAll('#subjects input').forEach(x=>x.addEventListener('change',renderUnits));
const descriptions={formula:"公式・意味・使う条件・例を確認します。",shortcut:"速く解く考え方と、使える条件を確認します。",basic:"基本事項の問題を解きます。",truefalse:"公式が正しいか判断し、成立条件を確認します。",geometry:"図形の条件を整理して解きます。",common:"文章・資料・条件を読み取る問題を解きます。",proof:"根拠と結論をつないで証明します。",mock:"複数分野を解き、結果から弱点を確認します."};
document.getElementById("mode").addEventListener("change",e=>document.getElementById("modeInfo").textContent=descriptions[e.target.value]||"");
document.getElementById("start").addEventListener("click",()=>{const subjects=[...document.querySelectorAll('#subjects input:checked')].map(x=>x.value);const selected=[...document.querySelectorAll('input[name="unit"]:checked')].map(x=>x.value);const error=document.getElementById("error");if(!subjects.length){error.textContent="先に数学Ⅰ・A・Ⅱ・B・Ⅲ・Cから科目を選んでください。";return}if(!selected.length){error.textContent="学習する単元を1つ以上選んでください。";return}const mode=document.getElementById("mode").value;const p=new URLSearchParams();p.set("mode",mode);p.set("subjects",subjects.join(","));p.set("units",selected.join("|"));location.href=(mode==="formula"||mode==="shortcut"?"./formulas.html?":"./practice.html?")+p.toString();});
</script></body></html>
