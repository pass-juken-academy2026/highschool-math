<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高校数学｜公式を見る</title><style>
:root{color-scheme:dark;--bg:#071426;--panel:#10233d;--line:#294563;--txt:#edf5ff;--muted:#c3d5e9;--accent:#7bdcff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.7 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:18px}a{color:var(--accent)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin:14px 0}.formula{background:#091a2e;border-left:4px solid var(--accent);padding:12px;margin:12px 0;border-radius:8px}.eq{font-size:1.3rem;font-weight:800;overflow-wrap:anywhere}.muted{color:var(--muted)}.pill{background:#203c5d;padding:4px 9px;border-radius:20px}</style></head><body><main><a href="./index.html">← 科目・単元選択へ戻る</a> <span class="pill">公式を見る・閲覧専用</span><h1 id="title">高校数学｜公式・覚え方</h1><p id="description" class="muted">このページは公式を読むためのページです。問題・解答入力・採点はありません。</p><div id="content"></div><p id="empty" hidden>選択した単元の公式はまだ登録されていません。単元を選び直してください。</p></main><script>
const p=new URLSearchParams(location.search),mode=p.get("mode")==="shortcut"?"shortcut":"formula",units=(p.get("units")||"").split("|").filter(Boolean);
const data=[
["数と式・二次方程式","平方差の公式","a² − b² = (a − b)(a + b)","平方の差を因数分解する公式。","a,bが実数なら成立。","x²−9=(x−3)(x+3)","二乗の差なら「差と和」をセット。"],
["数と式・二次方程式","二次方程式の解の公式","x = (−b ± √(b²−4ac)) / 2a","ax²+bx+c=0の解を求める。","a≠0。判別式D=b²−4acで実数解の個数を判断。","x²−5x+6=0ならx=2,3","分子は−b±√D、分母は2a。"],
["数と式・二次方程式","平方完成","x²+bx=(x+b/2)²−(b/2)²","二次式を平方の形に直す。","x²の係数が1のとき。","x²+6x=(x+3)²−9","xの係数の半分を入れ、その平方を引く。"],
["二次関数・グラフ","頂点形式","y=a(x−p)²+q","頂点は(p,q)、対称軸はx=p。","a>0なら下に凸、a<0なら上に凸。","y=2(x−3)²+1の頂点は(3,1)。","括弧内の符号は頂点のx座標と逆。"],
["二次関数・グラフ","判別式","D=b²−4ac","二次方程式の実数解の個数を判定。","a≠0。D>0は2実根、D=0は重解、D<0は実数解なし。","x²−4x+4=0はD=0。","プラスは2個、ゼロは重なる、マイナスは実数解なし。"],
["図形・三平方の定理","三平方の定理","a²+b²=c²","直角三角形の辺の長さの関係。","cは斜辺。直角三角形で使う。","辺が3,4なら斜辺は5。","斜辺の平方＝ほか2辺の平方の和。"],
["図形・三平方の定理","半径と接線","接点への半径 ⟂ 接線","円の接点と中心を結ぶ半径は接線と垂直。","接点で半径と接線が交わるとき。","接点でできる角は90°。","接線に半径を引いたら直角。"],
["確率・場合の数","確率の基本","確率＝条件に合う場合の数／全場合の数","条件に合う結果の割合。","すべての結果が同様に確からしいとき。","4枚中2枚が偶数カードなら確率は1/2。","求めたい場合÷全体。"],
["確率・場合の数","順列","nPr=n!/(n−r)!","順番を区別して選び並べる方法の数。","順序を区別する場合。","5人から会長・副会長を選ぶと5P2=20。","順番ありはP。"],
["確率・場合の数","組合せ","nCr=n!/(r!(n−r)!)","順番を区別せず選ぶ方法の数。","順序を区別しない場合。","5人から2人を選ぶと5C2=10。","順番なしはC。"],
["データ分析","平均値","平均値＝データの合計／個数","データ全体の中心を表す代表値。","外れ値の影響を受けやすい。中央値も確認。","2,4,6の平均は4。","全部足して個数で割る。"],
["データ分析","四分位範囲","四分位範囲＝第3四分位数−第1四分位数","中央付近のデータの散らばりを表す。","箱ひげ図や散らばりの比較に使う。","Q1=3、Q3=9なら四分位範囲は6。","Q3からQ1を引く。"],
["数列・ベクトル","等差数列の一般項","aₙ=a₁+(n−1)d","初項a₁、公差dの第n項。","隣り合う項の差が一定。","4,7,10,…の第10項は31。","公差を(n−1)回足す。"],
["数列・ベクトル","等差数列の和","Sₙ=n(a₁+aₙ)/2","等差数列の初項から第n項までの和。","初項・末項・項数が分かるとき。","4+7+10+13+16=50。","項数×（初項＋末項）÷2。"],
["数列・ベクトル","ベクトルの大きさ","|(x,y)|=√(x²+y²)","平面ベクトルの長さ。","成分が(x,y)のとき。","(3,4)の大きさは5。","成分を二乗して足し、平方根。"]
,["三角関数","基本公式","sin²θ + cos²θ = 1","三角関数の基本関係。","角度の単位を確認する。","sin²30°+cos²30°=1。","sinとcosの二乗和は1。"],["三角関数","加法定理","sin(α+β)=sinαcosβ+cosαsinβ","角の和の正弦を展開する。","符号は和か差かで変わる。","sin(30°+60°)=sin30°cos60°+cos30°sin60°。","和差の符号を確認。"],["指数・対数関数","指数法則","aᵐ×aⁿ=aᵐ⁺ⁿ","同じ底の積では指数を加える。","底や指数の条件を確認する。","2²×2³=2⁵=32。","底が同じなら指数を足す。"],["指数・対数関数","対数の定義","logₐx=y ⇔ aʸ=x","対数を指数表現に変換する。","a>0、a≠1、x>0。","log₂8=3 ⇔ 2³=8。","対数は指数に戻す。"],["微分・積分","べき関数の微分","(xⁿ)'=nxⁿ⁻¹","べき関数の微分の基本公式。","指数を前に掛け、指数を1減らす。","(x³)'=3x²。","前に掛けて1減らす。"],["微分・積分","不定積分","∫xⁿdx=xⁿ⁺¹/(n+1)+C","微分の逆操作として原始関数を求める。","n≠−1。積分定数Cを付ける。","∫2x dx=x²+C。","指数を1増やして割る。"],["極限","基本極限","lim(x→0) sin x/x = 1","三角関数の極限で頻出する基本結果。","xはラジアンで考える。","lim(x→0) sin(3x)/(3x)=1。","sin x/x の極限は1。"],["微分法","微分係数","f'(a)=lim(h→0){f(a+h)−f(a)}/h","点aにおける瞬間的な変化率を表す。","極限が存在するかを確認する。","f(x)=x²ならf'(3)=6。","接線の傾きと対応。"],["積分法","定積分の基本","∫ₐᵇ f(x)dx=F(b)−F(a)","原始関数Fを用いて定積分を計算する。","F'(x)=f(x)を満たすFを使う。","∫₀¹2x dx=[x²]₀¹=1。","上端の値−下端の値。"],["図形と方程式","円の方程式","(x−a)²+(y−b)²=r²","中心(a,b)、半径rの円を表す。","半径は正、中心座標の符号に注意。","中心(1,−2)、半径3なら(x−1)²+(y+2)²=9。","中心からの距離を二乗。"],["複素数と方程式","虚数単位","i²=−1","複素数の計算の基本。","iの累乗は周期4で整理できる。","i⁴=1。","i²を−1に置き換える。"],["平面上の曲線","楕円の標準形","x²/a²+y²/b²=1","中心が原点にある楕円を表す。","a,bは半軸の長さ。分母の大小で長軸を判定する。","x²/4+y²=1の長半径は2。","分母の平方根が半軸。"],["複素数平面","複素数の絶対値","|a+bi|=√(a²+b²)","複素数平面で原点からの距離を表す。","実部・虚部を直交座標とみなす。","|3+4i|=5。","実部と虚部で三平方。"];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
