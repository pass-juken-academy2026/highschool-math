</script><script id="subject-wide-search-script">
(()=> {
 const panel=document.getElementById('subject-wide-search');
 const input=document.getElementById('sws-query');
 const reset=document.getElementById('sws-reset');
 const meta=document.getElementById('sws-meta');
 const results=document.getElementById('sws-results');
 if(!panel||!input||!reset||!meta||!results)return;
 const selector='article,.entry,.question,.formula,.formula-card,.formula-item,.term,.word-card,.knowledge-item,.concept,.event,.timeline-item,.history-card,.topic-card,.topic,.topiclist,.knowledge-card,.term-card,.result-item,.resultrow,.data-result,.item,.unit,.card,.menu-card,tr,li';
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let matches=[];
 function textOf(el){return (el.innerText||el.textContent||'').replace(/\s+/g,' ').trim()}
 function indexItems(){
   const nodes=Array.from(document.querySelectorAll(selector)).filter(el=>!panel.contains(el));
   return nodes.filter(el=>{
     const text=textOf(el);
     if(text.length<8||text.length>1800)return false;
     let parent=el.parentElement;
     while(parent&&!panel.contains(parent)){
       if(parent.matches&&parent.matches(selector)){
         const parentText=textOf(parent);
         if(parentText.length>=8&&parentText.length<=1800)return false;
       }
       parent=parent.parentElement;
     }
     return true;
   }).map((el,i)=>({el,text:textOf(el),i}));
 }
 function render(){
   const q=input.value.trim().toLocaleLowerCase();
   results.innerHTML='';
   matches=[];
   if(!q){meta.textContent='検索語を入力すると、このページに表示されている学習項目を検索します。';return;}
   const terms=q.split(/\s+/).filter(Boolean);
   matches=indexItems().filter(item=>terms.every(t=>item.text.toLocaleLowerCase().includes(t))).slice(0,80);
   meta.textContent=matches.length+'件表示'+(matches.length===80?'（最大80件）':'')+'。元の単元・問題機能はそのまま使えます。';
   if(!matches.length){results.innerHTML='<p>該当する項目がありません。別の語句で検索するか、リセットしてください。</p>';return;}
   results.innerHTML=matches.map((item,i)=>{
     const title=(item.el.querySelector('h1,h2,h3,h4,strong,b,.title,.name')||item.el).innerText||item.text;
     const clean=title.replace(/\s+/g,' ').trim();
     const snippet=item.text.length>230?item.text.slice(0,230)+'…':item.text;
     return '<button type="button" class="sws-result" data-sws-index="'+i+'"><strong>'+esc(clean.slice(0,100))+'</strong><span>'+esc(snippet)+'</span></button>';
   }).join('');
 }
 input.addEventListener('input',render);
 reset.addEventListener('click',()=>{input.value='';render();input.focus();});
 results.addEventListener('click',event=>{
   const button=event.target.closest('[data-sws-index]');
   if(!button)return;
   const item=matches[Number(button.dataset.swsIndex)];
   if(!item)return;
   item.el.scrollIntoView({behavior:'smooth',block:'center'});
   const old=item.el.style.outline;
   item.el.style.outline='3px solid #65c9f1';
   item.el.style.outlineOffset='4px';
   setTimeout(()=>{item.el.style.outline=old;item.el.style.outlineOffset='';},1600);
 });
})();
</script></body></html>
